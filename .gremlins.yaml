# Configurazione della mutation testing con gremlins.
# `make mutate` esegue gremlins su internal/tray, internal/gui e internal/compose.
# Le soglie arrivano nel ticket 16: qui non ci sono cancelli.

silent: false

unleash:
  # 0 usa tutti i core della macchina.
  workers: 0
  # Il timeout di ogni giro di test vale 20 volte la durata del giro di copertura.
  # 5 volte non basta: la compilazione parallela supera il limite, e i mutanti
  # scadono invece di essere uccisi. Misurato nel ticket 15.
  timeout-coefficient: 20
  # Le regole sono espressioni regolari sul percorso del file.
  # I test sono esclusi da gremlins per default.
  exclude-files:
    - "internal/db/"
    - "internal/compose/composefake/"
    - "(_gen|_generated)\\.go$"
    - "\\.gen\\.go$"
    - "/generated/"
